<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida a Automotriz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f3a5f, #3d6a99);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
        }
        .tarjeta {
            background-color: #ffffff;
            color: #222;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #1f3a5f;
            font-size: 26px;
            margin-top: 0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
        }
        li {
            margin: 12px 0;
        }
        a {
            display: block;
            background-color: #e8a317;
            color: #1f3a5f;
            font-weight: bold;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #f5b93a;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Bienvenido a nuestra tienda Automotriz</h1>
        <p>Elige una seccion:</p>
        <ul>
            <li><a href="/autos/">Conoce nuestros automoviles</a></li>
            <li><a href="/proveedores/">Conoce a nuestros proveedores</a></li>
            <li><a href="/presupuesto/">Conoce nuestros presupuestos</a></li>
            <li><a href="/oferta/">Conoce nuestras ofertas semanales</a></li>
        </ul>
    </div>
</body>
</html>
