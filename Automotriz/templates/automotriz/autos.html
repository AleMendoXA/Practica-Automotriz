<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Automoviles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f3a5f, #3d6a99);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
        }
        .tarjeta {
            background-color: #ffffff;
            color: #222;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #1f3a5f;
            font-size: 26px;
            margin-top: 0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        li {
            background-color: #f2f4f7;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            background-color: #e8a317;
            color: #1f3a5f;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
        }
        a:hover {
            background-color: #f5b93a;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Conoce nuestros automoviles</h1>
        <p>Estos son algunos de los vehiculos disponibles:</p>
        <ul>
            <li>Sedan compacto</li>
            <li>Camioneta familiar</li>
            <li>SUV</li>
            <li>Camioneta tipo pickup</li>
        </ul>
        <a href="/bienvenida/">Volver al inicio</a>
    </div>
</body>
</html>
